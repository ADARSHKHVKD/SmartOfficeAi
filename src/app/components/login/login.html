<div class="login-page">

  <!-- Left 70% -->
  <div class="login-left">

    <div class="welcome-content">

      <h1>Welcome to Smart Office AI</h1>

      <p>
        Manage employees, tasks, attendance, leave and timesheets
        from one smart office management platform.
      </p>

      <div class="features">

        <div class="feature">
          <div class="feature-icon">✓</div>
          <span>Employee Management</span>
        </div>

        <div class="feature">
          <div class="feature-icon">✓</div>
          <span>Task Management</span>
        </div>

        <div class="feature">
          <div class="feature-icon">✓</div>
          <span>Attendance & Leave</span>
        </div>

        <div class="feature">
          <div class="feature-icon">✓</div>
          <span>Timesheet Management</span>
        </div>

      </div>

    </div>

  </div>


  <!-- Right 30% -->
  <div class="login-right">

    <div class="login-card"
         style="background-color: lightsteelblue; padding: 20px;">

      <h2>Login</h2>

      <p class="login-subtitle">
        Sign in to your account
      </p>

      <form>

        <div class="form-group">

          <label>Username</label>

          <input
            type="text"
            name="username"
            [(ngModel)]="username"
            placeholder="Enter username"
          />

        </div>


        <div class="form-group">

          <label>Password</label>

          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter password"
          />

        </div>


        <button
          type="button"
          (click)="login()">

          Login

        </button>

      </form>

    </div>

  </div>

</div>
